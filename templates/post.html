
{% extends "base.html" %}

{% block title %}{{ post.title }} - Little Moments{% endblock %}

{% block content %}

<article>
    <h2>{{ post.title }}</h2>

    <p>Published: {{ post.published_date }}</p>

    <div>
        <p>{{ post.body }}</p>
    </div>
</article>

<p>
    <a href="{{ url_for('home') }}">← Back to all posts</a>
</p>

{% endblock %}
